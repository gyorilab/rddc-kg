[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rddc-kg"
version = "0.1.0"
description = "Knowledge graph construction for the Rare Disease Data Commons (RDDC)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dglink @ git+https://github.com/gyorilab/dglink.git",
    "gilda",
    "pystow",
]

[tool.setuptools.packages.find]
where = ["src"]
